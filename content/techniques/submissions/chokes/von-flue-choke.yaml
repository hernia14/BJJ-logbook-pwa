cards:
  - id: von-flue-choke-def-01
    axis: definition
    type: free_recall
    front: フォンフルーチョークとはどのような絞めか
    back: |
      相手にギロチンチョークを仕掛けられた際、
      サイドコントロールへ移行して相手の首の下に肩を差し込み、
      肩の圧で締め返す絞め。

  - id: von-flue-choke-prin-01
    axis: principle
    type: free_recall
    front: フォンフルーチョークが「カウンター技」として成立する原理を説明せよ
    back: |
      ギロチンを仕掛けている相手は自分の腕を相手の首に回しているため、
      その腕が自分自身の首の一方を塞ぐ形になる。
      そこへ肩で反対側から圧を加えると、相手自身の腕が締めの一部として働く。

  - id: von-flue-choke-req-01
    axis: requirement
    type: free_recall
    front: フォンフルーチョークを成立させるための要件は何か
    back: |
      ギロチンを掛けられた状態から、相手の腕が首に回っている側とは反対側へ回り込み、
      サイドコントロールを取ること。
      そのうえで肩を相手の首元へ落とし、体重をかける。

  - id: von-flue-choke-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: von-flue-choke-causal-01
    front: フォンフルーチョークでよくある失敗を1つ挙げよ
    back: |
      サイドコントロールへ移行しきる前に肩の圧をかけようとすること。

  - id: von-flue-choke-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: von-flue-choke-causal-01
    front: フォンフルーチョークで移行しきる前に締めにいくと、結果として何が起きるか
    back: |
      自分の首が相手のギロチンの中に残ったまま時間が経過するため、
      締め返す前にこちらが極められる危険がある。

  - id: von-flue-choke-cnt-01
    axis: counter
    type: free_recall
    front: ギロチンを仕掛ける側はフォンフルーチョークをどう避けるか
    back: |
      相手にサイドコントロールへ回り込ませないこと。
      ガードに引き込むか、相手の体を自分の正面に保つことで、
      肩を首元へ差し込まれる位置を与えない。
