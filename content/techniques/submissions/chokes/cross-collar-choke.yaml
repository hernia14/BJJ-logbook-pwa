cards:
  - id: cross-collar-choke-def-01
    axis: definition
    type: free_recall
    front: クロスカラーチョークとはどのような絞めか
    back: |
      両手を交差させて相手の左右の襟を掴み、
      腕を交差させたまま引くことで首の両側を締める絞め。道衣を使うGi特有の技。

  - id: cross-collar-choke-grip-01
    axis: grip
    type: free_recall
    front: クロスカラーチョークにおけるグリップの深さの要点を述べよ
    back: |
      最初の手を相手の襟の深い位置（首の後ろ側に近い位置）まで入れること。
      浅いと引いても襟が首に巻き付かず、締めが生じない。

  - id: cross-collar-choke-prin-01
    axis: principle
    type: free_recall
    front: クロスカラーチョークが効く原理を説明せよ
    back: |
      交差した両腕を引くことで、道衣の襟が相手の首の両側に食い込み、
      頸動脈を圧迫する。
      腕で首を締めるのではなく、道衣という道具を介して圧を伝える構造にある。

  - id: cross-collar-choke-fin-01
    axis: finish
    type: free_recall
    front: クロスカラーチョークの仕上げの要点を挙げよ
    back: |
      両肘を外へ開くのではなく、引きながら締める方向へ動かすこと。
      加えて相手のポスチャーを崩して距離を詰めることで、
      腕の可動範囲を有効に使える。

  - id: cross-collar-choke-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: cross-collar-choke-causal-01
    front: クロスカラーチョークでよくある失敗を1つ挙げよ
    back: |
      最初のグリップが浅いまま2本目の手を入れようとすること。

  - id: cross-collar-choke-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: cross-collar-choke-causal-01
    front: クロスカラーチョークで最初のグリップが浅いと、結果として何が起きるか
    back: |
      引いても襟が首に巻き付かず締まらない。
      さらに両手が塞がった状態が続くため、
      相手にポスチャーを立て直されるかグリップを切られる。

  - id: cross-collar-choke-cnt-01
    axis: counter
    type: free_recall
    front: クロスカラーチョークに対する基本的な防御を挙げよ
    back: |
      相手の1本目のグリップが深く入る前に襟を守り手を払うこと、
      顎を引いて襟が首に回る空間を消すこと、
      そしてポスチャーを立てて距離を取ること。
