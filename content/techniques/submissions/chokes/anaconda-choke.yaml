cards:
  - id: anaconda-choke-def-01
    axis: definition
    type: free_recall
    front: アナコンダチョークとはどのような絞めか
    back: |
      相手の首と片腕を囲う点はダースチョークと同じだが、
      腕を通す方向が逆で、相手の腋の下側から腕を通して組む絞め。

  - id: anaconda-choke-def-02
    axis: definition
    type: free_recall
    front: アナコンダチョークとダースチョークの違いを述べよ
    back: |
      いずれも相手の首と片腕をまとめて締める同系統の技だが、
      腕を差し込む方向が逆になる。
      その結果、仕掛けやすい相手の体勢や、仕上げの体の動かし方が異なる。

  - id: anaconda-choke-prin-01
    axis: principle
    type: free_recall
    front: アナコンダチョークが効く原理を説明せよ
    back: |
      ダースチョークと同様に、相手自身の肩と腕が首の一方を圧迫し、
      自分の腕が反対側を圧迫することで頸動脈を両側から挟む。

  - id: anaconda-choke-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: anaconda-choke-causal-01
    front: アナコンダチョークでよくある失敗を1つ挙げよ
    back: |
      腕を組むことに気を取られ、締めの構造ができる位置まで
      自分の体を移動させないこと。

  - id: anaconda-choke-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: anaconda-choke-causal-01
    front: アナコンダチョークで体の位置が不適切だと、結果として何が起きるか
    back: |
      腕を組めていても圧の方向が首の側面に向かず締まらない。
      その間に相手は腕を抜くか体勢を変えて脱出する。

  - id: anaconda-choke-cnt-01
    axis: counter
    type: free_recall
    front: アナコンダチョークに対する基本的な防御を挙げよ
    back: |
      囲われそうな側の腕を早い段階で引き抜くこと、
      そして相手が締めの位置へ移動する動きに合わせて体の向きを変えること。
