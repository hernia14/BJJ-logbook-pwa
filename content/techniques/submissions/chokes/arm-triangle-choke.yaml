cards:
  - id: arm-triangle-choke-def-01
    axis: definition
    type: free_recall
    front: 肩固めとはどのような絞めか
    back: |
      相手の首と片腕を自分の腕と胸で挟み込んで絞める技。
      押してくる相手の腕を流してから、逆サイドへ移動して絞める。

  - id: arm-triangle-choke-hier-01
    axis: hierarchy
    type: free_recall
    front: 肩固めが腕十字などと比べて持つ利点は何か
    back: |
      身体を大きく動かしてかける技と違い、
      相手に密着したまま使えるため、ポジションを失いづらい。

  - id: arm-triangle-choke-req-01
    axis: requirement
    type: free_recall
    front: 肩固めに入るきっかけとして、相手のどのような動きを利用するか
    back: |
      相手がエビをして逃げようとする動き。
      それに合わせて少し圧力をゆるめ、相手が横を向くようにする。
      そのうえで肘の近くを押して相手の腕を流す。

  - id: arm-triangle-choke-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: arm-triangle-choke-causal-01
    front: 肩固めに入れないとき、相手の腕はどこにあることが多いか
    back: |
      相手の前腕が自分の首の下に入っている。

  - id: arm-triangle-choke-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: arm-triangle-choke-causal-01
    front: 相手の前腕が首の下に入っていると、なぜ肩固めが成立しないのか
    back: |
      首と腕を挟む構造が作れず、極めに必要な形にならないため。
      先に腕を流して、その状態を解消する必要がある。

  - id: arm-triangle-choke-fin-01
    axis: finish
    type: free_recall
    front: 肩固めで小さくする2つの三角はどこか
    back: |
      1. 絞め腕の前腕と上腕でできる三角
      2. 絞め腕の上腕と自分の体側でできる三角

  - id: arm-triangle-choke-fin-02
    axis: finish
    type: free_recall
    front: 肩固めで「肘を曲げて絞める」ことにとらわれると、なぜ力が逃げるのか
    back: |
      肘を曲げる力だけだと自分の正中線が横へ移動してしまうため。
      反対側の脇を締める力を加えると、両者の合力として絞める方向へ働く。
      さらに足で床を蹴る力を加えると効果が増す。

  - id: arm-triangle-choke-prin-01
    axis: principle
    type: free_recall
    front: 肩固めを「腕で絞める」のではなく身体全体で絞めるとき、どのようなイメージになるか
    back: |
      自分の体側で相手の体側を押すことで、
      相手の首が自分の肘へ押しつけられる、というイメージ。

  - id: arm-triangle-choke-ang-01
    axis: angle_weight
    type: free_recall
    front: 肩固めの仕上げで、胴体の高さをどう扱うか
    back: |
      身体全体をいったん床ぎりぎりまで下げてから、
      脇を締める力と床を蹴る力で上へ登る。胴体は床の近くを保つ。

  - id: arm-triangle-choke-cnt-01
    axis: counter
    type: free_recall
    front: 肩固めに対する基本的な防御を挙げよ
    back: |
      囲われそうな腕を早い段階で引き抜くこと、
      前腕を相手の首の下へ入れて挟む構造を作らせないこと、
      そして相手が逆サイドへ移動する動きに合わせて自分も向きを変えること。
