cards:
  - id: darce-choke-def-02
    axis: definition
    type: free_recall
    front: ダースチョークとブラボーチョークは同じ技か
    back: |
      別の技として扱う。
      ブラボーチョークは道衣の裾を紐状にして絞めるGiの技であり、
      ダースチョークは相手の首と片腕を腕で囲って締める技。
      英語圏では両者が混同して呼ばれることがあるため注意する。
    note: |
      本カード群では『寝技の学校』下巻 p.40 の用法に従い、
      ブラボーチョーク＝裾を使う絞め（brabo-choke.yaml）として区別している。
      道場での呼び分けと異なる場合はレビュー時に指示してほしい。

  - id: darce-choke-def-01
    axis: definition
    type: free_recall
    front: ダースチョークとはどのような絞めか
    back: |
      相手の首と片腕をまとめて自分の腕で囲い、
      腕を組んで（フィギュアフォアの形で）締める絞め。
      相手の腕が首の一方を圧迫する構造になる。

  - id: darce-choke-prin-01
    axis: principle
    type: free_recall
    front: ダースチョークが効く原理を説明せよ
    back: |
      相手自身の肩と腕が首の片側を圧迫し、
      自分の腕が反対側を圧迫する。
      両側から頸動脈を挟む形になるため、腕力に頼らず締められる。

  - id: darce-choke-req-01
    axis: requirement
    type: free_recall
    front: ダースチョークを効かせるための要件は何か
    back: |
      腕を深く通して肘が相手の首の向こう側まで出ていること。
      浅いと相手の腕と首をまとめて囲えず、締めの構造が成立しない。

  - id: darce-choke-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: darce-choke-causal-01
    front: ダースチョークでよくある失敗を1つ挙げよ
    back: |
      腕の差し込みが浅いまま組んでしまい、締めようとすること。

  - id: darce-choke-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: darce-choke-causal-01
    front: ダースチョークで腕の差し込みが浅いと、結果として何が起きるか
    back: |
      首の両側を挟む構造ができず締まらない。
      加えて自分の両腕が塞がるため、
      相手に体勢を変えられた際に対応できず位置を失う。

  - id: darce-choke-cnt-01
    axis: counter
    type: free_recall
    front: ダースチョークに対する基本的な防御を挙げよ
    back: |
      腕を深く差し込まれる前に、囲われそうな側の腕を引き抜くこと。
      また、相手が腕を通してくる側の肩を床につけて隙間を消すこと。
