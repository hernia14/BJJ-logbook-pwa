cards:
  - id: rear-naked-choke-def-01
    axis: definition
    type: free_recall
    front: 裸絞め（リアネイキッドチョーク）とはどのような絞めか
    back: |
      背後から片腕を相手の首に回し、
      その手を反対の腕に組んで（多くはフィギュアフォアの形で）
      首の両側を締める絞め。道衣を使わないためノーギでも成立する。

  - id: rear-naked-choke-prin-01
    axis: principle
    type: free_recall
    front: 裸絞めが「血流を止める絞め」として機能する原理を説明せよ
    back: |
      首の両側にある頸動脈を圧迫し、脳への血流を制限する。
      気道を潰すのではなく血流を止めるため、
      正しく入れば相手の力の強さや我慢とは関係なく効く。

  - id: rear-naked-choke-req-01
    axis: requirement
    type: free_recall
    front: 裸絞めを効かせるために、腕はどこに位置していなければならないか
    back: |
      首に回した腕の肘が相手の顎の真下、首の中心線に来ていること。
      腕が首の側方にずれていると圧迫すべき箇所を捉えられず、
      顎の上にかかると相手に防がれる。

  - id: rear-naked-choke-fin-01
    axis: finish
    type: free_recall
    front: 裸絞めの仕上げにおける決め手は何か
    back: |
      腕を引く力だけでなく、胸を相手の背中に密着させて上体全体で締めること。
      腕力だけでは首の両側に均等な圧を作れない。

  - id: rear-naked-choke-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: rear-naked-choke-causal-01
    front: 裸絞めでよくある失敗を1つ挙げよ
    back: |
      腕を首に回す際に浅く入り、相手の顎の前で止まってしまうこと。

  - id: rear-naked-choke-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: rear-naked-choke-causal-01
    front: 裸絞めで腕が浅く顎の前で止まると、結果として何が起きるか
    back: |
      頸動脈ではなく顎や気道に圧が向かうため、絞めとして効かない。
      さらに相手は顎を引いて腕を挟み込み、防御を固める時間を得る。

  - id: rear-naked-choke-cnt-01
    axis: counter
    type: free_recall
    front: 裸絞めに対する基本的な防御を挙げよ
    back: |
      顎を引いて首と相手の腕の間に空間を作らせないこと、
      相手の絞めに来る腕を両手で制すること、
      そして背中を床方向へ落として密着を切ること。
    note: |
      絞め技は意識消失に至りうる技術である。
      練習上の安全管理（タップの判断、掛ける側の責任、危険な兆候）は
      safety カテゴリで人間の記述に基づき別途扱う。このカードでは扱わない。
