cards:
  - id: omoplata-def-01
    axis: definition
    type: free_recall
    front: オモプラータとはどのような関節技か
    back: |
      自分の脚で相手の腕を絡めて固定し、
      肩関節を回旋させる関節技。キムラを腕ではなく脚で行う形にあたる。

  - id: omoplata-req-01
    axis: requirement
    type: free_recall
    front: オモプラータを成立させるために制すべきものは何か
    back: |
      相手の上体。脚で腕を絡めるだけでは相手が前転して逃げられるため、
      腰や帯を掴むなどして前方への回転を止める必要がある。

  - id: omoplata-prin-01
    axis: principle
    type: free_recall
    front: オモプラータで「脚を使う」ことの利点を説明せよ
    back: |
      脚は腕より強い筋群であり、かつ相手の腕1本に対して
      自分の脚と体幹全体を当てられる。
      腕力の差に左右されにくく、体格で劣る側でも成立させやすい。

  - id: omoplata-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: omoplata-causal-01
    front: オモプラータでよくある失敗を1つ挙げよ
    back: |
      脚で腕を絡めることだけに集中し、相手の上体のコントロールを取らないこと。

  - id: omoplata-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: omoplata-causal-01
    front: オモプラータで相手の上体を制さないと、結果として何が起きるか
    back: |
      相手は前転（ロール）して肩への負荷を逃がしながら脱出する。
      脱出後はこちらが仰向けで脚を絡めた不利な体勢に取り残される。

  - id: omoplata-cnt-01
    axis: counter
    type: free_recall
    front: オモプラータに対する基本的な防御を挙げよ
    back: |
      絡められる前に腕を引き抜くこと、
      絡められた場合は前方へ回転して肩の可動方向へ逃げること、
      あるいは相手の腰へ体重をかけて回転させないこと。

  - id: omoplata-fol-01
    axis: followup
    type: free_recall
    front: オモプラータが「極まらなくても価値がある」理由を説明せよ
    back: |
      腕を脚で固定した状態は、相手の姿勢と動ける方向を強く制限する。
      極まらない場合でもスイープや別の攻撃、
      あるいはポジションの移行に繋げられる。
