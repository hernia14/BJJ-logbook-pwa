cards:
  - id: fifty-fifty-guard-def-01
    axis: definition
    type: free_recall
    front: 50/50ガードとはどのような状態を指すか
    back: |
      互いの片脚を相手の脚に絡め合い、双方が鏡写しの同じ形になっている状態。
      名称は、両者が理論上まったく同じ攻撃機会を持つ対称性に由来する。

  - id: fifty-fifty-guard-prin-01
    axis: principle
    type: free_recall
    front: 50/50ガードが「対称」であることが戦術上どういう意味を持つか説明せよ
    back: |
      双方が同じ構造にあるため、こちらができる攻撃は原則として相手にも可能である。
      したがって優位は形そのものではなく、
      角度・グリップ・仕掛ける速さの差によって生まれる。

  - id: fifty-fifty-guard-req-01
    axis: requirement
    type: free_recall
    front: 50/50ガードで優位を作るために必要な要素は何か
    back: |
      対称性を崩すこと。具体的には上体の角度や手のグリップ、
      相手の自由な脚のコントロールなど、脚の絡み以外の部分で差を作る。

  - id: fifty-fifty-guard-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: fifty-fifty-guard-causal-01
    front: 50/50ガードでよくある失敗を1つ挙げよ
    back: |
      脚を絡めた状態で膠着し、上体やグリップで差を作らないまま留まること。

  - id: fifty-fifty-guard-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: fifty-fifty-guard-causal-01
    front: 50/50ガードで膠着したまま留まると、結果として何が起きるか
    back: |
      対称であるため、先に対称性を崩した側が主導権を取る。
      動かなければ相手に先を取られるか、試合では膠着として扱われうる。
    note: 競技上の膠着の扱い（警告・ペナルティ等）は IBJJF v6.0 を典拠に rules カテゴリで別途扱う。

  - id: fifty-fifty-guard-fol-01
    axis: followup
    type: free_recall
    front: 50/50ガードからの展開の方向性を挙げよ
    back: |
      相手を倒して上を取るスイープ、脚の絡みを解いて別のガードへの移行、
      あるいは足関節技への移行。
    note: |
      足関節技の可否・危険性・帯別の扱いは safety および rules カテゴリで
      人間の記述と IBJJF v6.0 を典拠に別途扱う。ここでは掛け方・禁忌は扱わない。
