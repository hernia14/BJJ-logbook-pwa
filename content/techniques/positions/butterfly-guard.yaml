cards:
  - id: butterfly-guard-def-01
    axis: definition
    type: free_recall
    front: バタフライガードとはどのような状態を指すか
    back: |
      下の者が座った姿勢で、両足の甲（フック）を相手の腿の内側に掛けて制している状態。
      フックによって相手の下半身を持ち上げられる点が特徴。

  - id: butterfly-guard-req-01
    axis: requirement
    type: free_recall
    front: バタフライガードで下の者が取るべき姿勢の要件は何か
    back: |
      仰向けに寝ずに座った姿勢を保ち、上体を起こしておくこと。
      加えてアンダーフックや上体のグリップで相手を引き寄せ、密着を作る。

  - id: butterfly-guard-prin-01
    axis: principle
    type: free_recall
    front: バタフライガードのフックが相手を崩せる原理を説明せよ
    back: |
      フックが相手の腿の下に入ることで、相手の体重を支える脚を床から浮かせられる。
      支持している脚が浮くとその方向へのバランスが失われ、
      上体のグリップで引き込む力と合わせて相手を傾けられる。

  - id: butterfly-guard-mis-01
    axis: common_mistake
    type: free_recall
    causal_pair_id: butterfly-guard-causal-01
    front: バタフライガードでよくある失敗を1つ挙げよ（姿勢に関するもの）
    back: |
      仰向けに寝てしまい、上体を起こした座り姿勢を保てないこと。

  - id: butterfly-guard-con-01
    axis: consequence
    type: free_recall
    causal_pair_id: butterfly-guard-causal-01
    front: バタフライガードで仰向けに寝てしまうと、結果として何が起きるか
    back: |
      フックで相手を持ち上げるための上体の力が使えなくなり、
      相手に上から体重を乗せられてフックを潰される。
      持ち上げる機能を失ったフックは容易に外され、パスを許す。

  - id: butterfly-guard-fol-01
    axis: followup
    type: free_recall
    front: バタフライガードからの代表的な展開を挙げよ
    back: |
      フックで相手を持ち上げて横に倒すスイープ（バタフライスイープ）、
      あるいは相手が抵抗して押し返してきた力を利用した別方向へのスイープや
      背後を取る動きへ繋げる。
